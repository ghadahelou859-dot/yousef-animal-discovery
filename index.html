<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#168a4f">
  <title>Yousef's Animal Discovery</title>
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
  <main id="app">
    <section id="welcome" class="screen active image-screen" aria-label="Welcome">
      <picture class="full-art">
        <source media="(max-width:700px)" srcset="animal-world-welcome-mobile.png">
        <img src="animal-world-welcome-desktop.png" alt="The Animal World — Let's Explore">
      </picture>
      <button id="startBtn" class="hotspot welcome-hotspot" type="button" aria-label="Start the adventure">
        <span class="sr-only">Start the adventure</span>
      </button>
    </section>

    <section id="videoScreen" class="screen video-screen" aria-label="Welcome video">
      <video id="welcomeVideo" playsinline preload="metadata" controls>
        <source media="(min-width:701px)" src="YOUSF%20.mp4" type="video/mp4">
        <source src="welcome.mp4" type="video/mp4">
      </video>
      <p id="videoMessage" class="video-message" aria-live="polite"></p>
    </section>

    <section id="mapScreen" class="screen image-screen" aria-label="Animal Adventure Map">
      <picture class="full-art map-art">
        <source media="(max-width:700px)" srcset="adventure-map-mobile.png?v=2">
        <img src="adventure-map-desktop.png?v=2" alt="Animal Adventure Map">
      </picture>
      <button class="map-bear" data-lesson="0" type="button" aria-label="Open Animals lesson">
        <img src="polar-bear.png?v=2" alt="">
        <span>Animals</span>
      </button>
      <button class="hotspot map-node map-2" data-lesson="1" type="button" aria-label="Open Movement"></button>
      <button class="hotspot map-node map-3" data-lesson="2" type="button" aria-label="Open Coverings"></button>
      <button class="hotspot map-node map-4" data-lesson="3" type="button" aria-label="Open Insects"></button>
      <button class="hotspot map-node map-5" data-lesson="4" type="button" aria-label="Open Ant Parts"></button>
      <button class="hotspot map-node map-6" data-lesson="5" type="button" aria-label="Open Animal Needs"></button>
      <button id="openQuiz" class="hotspot map-node map-7" type="button" aria-label="Open challenge"></button>
    </section>

    <section id="lessonScreen" class="screen image-screen" aria-label="Lesson">
      <picture class="full-art lesson-art">
        <source id="lessonMobileSource" media="(max-width:700px)" srcset="lesson-01-mobile.jpg">
        <img id="lessonImage" src="lesson-01-mobile.jpg" alt="Animal lesson">
      </picture>
      <button class="round-control back-control go-map" type="button" aria-label="Back to map"><img src="back-arrow.png" alt=""></button>
      <button id="playLessonAudio" class="round-control audio-control" type="button" aria-label="Play lesson audio"><img src="speaker.png" alt=""></button>
      <nav class="lesson-nav" aria-label="Lesson navigation">
        <button id="previousLesson" type="button">Previous</button>
        <button id="nextLesson" type="button">Next</button>
      </nav>
      <audio id="lessonAudio" preload="metadata"></audio>
    </section>

    <section id="quizScreen" class="screen image-screen quiz-screen" aria-labelledby="questionText">
      <picture class="full-art">
        <source media="(max-width:700px)" srcset="quiz-background-mobile.png">
        <img src="quiz-background-desktop.png" alt="">
      </picture>
      <button class="round-control back-control go-map" type="button" aria-label="Back to map"><img src="back-arrow.png" alt=""></button>
      <div class="quiz-panel">
        <h1 class="quiz-title">Animal Challenge</h1>
        <div class="quiz-topline">
          <span id="questionCount">Question 1 of 10</span>
          <span class="timer"><span id="timerValue">10</span>s</span>
        </div>
        <div class="ant-track" aria-hidden="true">
          <span class="ant-dot"></span><span class="ant-dot"></span><span class="ant-dot"></span><span class="ant-dot"></span><span class="ant-dot"></span>
          <span class="ant-dot"></span><span class="ant-dot"></span><span class="ant-dot"></span><span class="ant-dot"></span><span class="ant-dot"></span>
          <img id="antRunner" class="ant-runner" src="progress-ant.png" alt="">
        </div>
        <button id="playQuestionAudio" class="question-speaker" type="button" aria-label="Play question audio"><img src="speaker.png" alt=""></button>
        <h2 id="questionText"></h2>
        <div id="answers" class="answers"></div>
        <img id="feedbackSticker" class="feedback-sticker" src="correct.png" alt="" aria-hidden="true">
        <p id="quizFeedback" class="feedback" aria-live="polite"></p>
      </div>
      <audio id="questionAudio" preload="metadata"></audio>
      <audio id="animalAudio" preload="metadata"></audio>
    </section>

    <section id="resultScreen" class="screen result-screen" aria-labelledby="resultTitle">
      <div class="result-stage">
        <picture class="result-art">
          <source media="(max-width:700px)" srcset="result-page-mobile.png">
          <img src="result-page-desktop.png" alt="Yousef and the ant celebrating the completed animal challenge">
        </picture>
        <div id="celebration" class="celebration" hidden aria-hidden="true"></div>
        <h2 id="resultTitle" class="sr-only">Great exploring!</h2>
        <strong id="resultScore" class="result-score">0/10</strong>
        <p id="scoreText" class="sr-only"></p>
        <button id="retryQuiz" class="result-hotspot result-retry" type="button" aria-label="Try again"></button>
        <button class="go-map result-hotspot result-map" type="button" aria-label="Back to map"></button>
        <div id="ratingButtons" class="rating" aria-label="Rate this adventure">
          <button data-rating="1" aria-label="1 star">★</button><button data-rating="2" aria-label="2 stars">★</button><button data-rating="3" aria-label="3 stars">★</button><button data-rating="4" aria-label="4 stars">★</button><button data-rating="5" aria-label="5 stars">★</button>
        </div>
        <div class="social-hotspots" aria-label="Contact links">
          <a class="social-hotspot social-whatsapp" href="https://wa.me/970598494977" target="_blank" rel="noopener" aria-label="WhatsApp" data-analytics="social_click" data-platform="whatsapp" data-button="result-whatsapp"></a>
          <a class="social-hotspot social-facebook" aria-label="Facebook" aria-disabled="true"></a>
          <a class="social-hotspot social-instagram" href="https://instagram.com/ghada.invitations" target="_blank" rel="noopener" aria-label="Instagram" data-analytics="social_click" data-platform="instagram" data-button="result-instagram"></a>
          <a class="social-hotspot social-tiktok" href="https://www.tiktok.com/@ghada.invitations" target="_blank" rel="noopener" aria-label="TikTok" data-analytics="social_click" data-platform="tiktok" data-button="result-tiktok"></a>
        </div>
      </div>
    </section>
  </main>
  <button id="projectLike" class="project-like" type="button" aria-label="Like this adventure" aria-pressed="false" hidden>
    <span class="heart-glyph" aria-hidden="true">♥</span>
    <span id="likeCount" class="like-count" aria-label="Total likes">—</span>
  </button>
  <script src="analytics.js?v=2"></script>
  <script>GhadaAnalytics.init({projectSlug:"عالم-الحيونات-مع-يوسف",pageKey:"main"});</script>
  <script src="script.js?v=13"></script>
</body>
</html>
